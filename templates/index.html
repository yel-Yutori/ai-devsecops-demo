<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>程式碼安檢站</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>程式碼安檢站</h1>
      <p class="sub">貼上 Python 程式碼，看看它能不能通過上線前的自動檢查。只會掃描，不會執行。</p>
      <p class="ver">網站版本 <span class="badge">{{ version }}</span></p>
    </header>

    <section class="panel">
      <div class="toolbar">
        <button type="button" id="btn-vuln" class="ghost">載入有漏洞範例</button>
        <button type="button" id="btn-safe" class="ghost">載入安全範例</button>
        <button type="button" id="btn-clear" class="ghost">清空</button>
      </div>
      <textarea id="code" spellcheck="false" maxlength="{{ max_chars }}"
        placeholder="在這裡貼上或輸入 Python 程式碼，或點上方範例"></textarea>
      <div class="foot">
        <span id="counter">0 / {{ max_chars }}</span>
        <button type="button" id="btn-scan" class="primary">送出檢查</button>
      </div>
    </section>

    <section id="result" class="panel hidden">
      <div id="verdict" class="verdict"></div>
      <ol id="stages" class="stages"></ol>
      <h2 id="issues-title" class="hidden">發現的問題</h2>
      <ul id="issues" class="issues"></ul>
    </section>

    <p class="legal">教學展示用：結果與上線流水線使用相同的檢查工具與標準，但僅供學習，不保證能抓出所有問題。</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
